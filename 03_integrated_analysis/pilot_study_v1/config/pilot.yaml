schema_version: pilot_study_v1
rule_version: id_alignment_v2
random_seed: 20261015
random_implementation: sha256_keyed_rank
offset_unit: python_unicode_code_point
offset_interval: half_open_start_inclusive_end_exclusive
primary_model:
  provider: openai
  model_id: gpt-6.1-sol
  revision: null
  temperature: 0
  max_output_tokens: 4096
optional_open_model:
  enabled: false
  provider: local_vllm
  model_id: Qwen3-14B
  weights_path: null
encoder:
  cross_encoder: ncbi/MedCPT-Cross-Encoder
  enabled: false
multivers:
  enabled: false
sampling:
  classes:
    - identical
    - core_subset
    - semmed_subset
    - partial_overlap
    - disjoint
  bands:
    small: [4, 8]
    large: [9, 20]
  per_class_per_band: 1
  min_pmid_each_source: 2
  max_pair_pmid: 140
  k_small_pairs: 5
  e3_pmid_per_pair: 2
  e3_pmid_global: 20
  e4_seed_pairs: 3
  e4_paths_per_seed: 3
  e4_abstracts_per_edge: 2
  e4_extra_abstract_slots: 36
  e5_candidates_per_branch: 3
  e5_results_per_query: 5
  e5_metadata_cap: 50
  e5_new_abstract_cap: 60
  e6_replicate_pairs: 2
  e6_replicates: 2
  e6_perturbation_items: 6
  e6_open_abstracts: 20
  equal_article_draws: 50
  equal_article_cap: 5
  equal_article_min: 2
required_comparability_fields:
  all:
    - study_system
    - comparator
    - outcome
  expression_difference:
    - measurement_context
  prognostic_association:
    - exposure_or_intervention
    - outcome
  gene_perturbation:
    - exposure_or_intervention
    - perturbation_direction
    - comparator
modifiers:
  - cancer_subtype
  - stage
  - timepoint
  - adjustment_factors
graph:
  graph_scope_version: null
  damping: 0.4
  allowed_predicates: []
  positive_edges_only: true
text:
  max_input_chars: 48000
  sentence_split: punctuation_with_original_offsets
  recover_semmed_sentences: true
references:
  - id: core
    url: https://academic.oup.com/database/article/doi/10.1093/database/baad061/7284097
  - id: semmeddb_schema
    url: https://lhncbc.nlm.nih.gov/temp/SemRep_SemMedDB_SKR/dbinfo.html
  - id: evidence_inference
    url: https://aclanthology.org/2020.bionlp-1.13/
  - id: care
    url: https://aclanthology.org/2024.findings-naacl.285/
  - id: multivers
    url: https://aclanthology.org/2022.findings-naacl.6/
  - id: medcpt
    url: https://pubmed.ncbi.nlm.nih.gov/37930897/
  - id: eraser
    url: https://aclanthology.org/2020.acl-main.408/
  - id: robinson_gaps
    url: https://pubmed.ncbi.nlm.nih.gov/21937195/
  - id: hetionet_dwpc
    url: https://doi.org/10.7554/eLife.26726
  - id: gpt_6_1_sol
    url: https://developers.openai.com/api/docs/models/gpt-6.1-sol
  - id: qwen3_14b
    url: https://huggingface.co/Qwen/Qwen3-14B
