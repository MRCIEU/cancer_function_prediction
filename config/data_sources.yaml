semmeddb:
  release_id: semmedVER43_2024
  source_url: https://lhncbc.nlm.nih.gov/temp/SemRep_SemMedDB_SKR/SemMedDB_download.html
  schema_url: https://lhncbc.nlm.nih.gov/temp/SemRep_SemMedDB_SKR/dbinfo.html
  database_name: semmedVER43_R
  semrep_version: "1.8"
  corpus: MEDLINE baseline 2022 plus PubMed update files through 2024-05-08
  anaphora: "off"
  quote_handling: >-
    Quoted fields use a backslash before an embedded quotation mark.
    The parser rewrites that sequence to a doubled CSV quote and leaves
    the unquoted \N null marker unchanged. This was logged before any
    path-count inspection.
  access: >-
    UMLS Terminology Services restricted download. The authorised API key
    already present in the user environment is used. The key, tickets, and
    signed URLs are never written to manifests, configs, or logs.
  base_url: https://data.lhncbc.nlm.nih.gov/umls-restricted/ii/tools/SemRep_SemMedDB_SKR/
  published_row_counts:
    CITATIONS: 37233341
    ENTITY: 1982424585
    GENERIC_CONCEPT: 259
    PREDICATION: 130480195
    PREDICATION_AUX: 130480181
    SENTENCE: 263160520
  files:
    - table: PREDICATION
      name: semmedVER43_2024_R_PREDICATION.csv.gz
    - table: ENTITY
      name: semmedVER43_2024_R_ENTITY.csv.gz
    - table: CITATIONS
      name: semmedVER43_2024_R_CITATIONS.csv.gz
    - table: GENERIC_CONCEPT
      name: semmedVER43_2024_R_GENERIC_CONCEPT.csv.gz
  not_downloaded:
    - table: SENTENCE
      reason: >-
        Sentence identifiers are already on PREDICATION.SENTENCE_ID. The
        sentence text file is article prose and is not required for this phase.
    - table: PREDICATION_AUX
      reason: >-
        Negation is carried by the PREDICATE value. Auxiliary mention scores
        are not used as scientific credibility and are not required to build
        or audit the graph.

ncbigene:
  release_id: ncbigene_info_ftp
  source_url: https://ftp.ncbi.nlm.nih.gov/gene/DATA/gene_info.gz
  role: species-specific validation of NCBI Gene identifiers
  note: >-
    Snapshot identity is the file retrieved for this run, recorded by byte
    size and SHA-256. The file header names the taxonomy column #tax_id.
    The parser strips that leading hash. Homo sapiens is taxonomy 9606.

